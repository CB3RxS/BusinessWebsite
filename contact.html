<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style-contact.css">
    <title>Contact Us | Perk Up Cafe</title>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="nav">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="products.html">PRODUCTS</a></li>
                    <li><a href="gallery.html">GALLERY</a></li>
                    <li><a href="about.html">ABOUT US</a></li>
                    <li><a href="contact.html">CONTACT US</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <!-- Contact Page -->
    <main class="contact-page">
        <section class="contact-grid">

            <!-- Top Left - Contact Image -->
            <div class="contact-image">
                <img src="assets/coffeepour.jpg" alt="Perk Up Cafe">
                <div class="contact-title">
                    <h1>Contact Us</h1>
                </div>

            </div>

            <!-- Top Right - Contact Form -->
            <div class="contact-form">
                <form>
                    <div class="form-row">

                        <div class="form-group">
                            <label for="full-name">Full Name</label>
                            <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="yourname@gmail.com" required>
                        </div>
                    </div>


                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX">
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date">
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="option">Subject</label>
                        <select id="option" name="option">
                            <option value="">Please select</option>
                            <option value="Review">Review</option>
                            <option value="Inquiry">Inquiry</option>
                            <option value="Business">Business Query</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                        ></textarea>
                    </div>
                    <div class="form-group">
                        <label for="file">File Upload</label>
                        <input type="file" id="file" name="file">
                    </div>
                    <div class="form-buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </div>
                </form>

                <!-- Facebook -->
                <div class="facebook-link">
                    <a href="https://www.facebook.com/p/Perk-Up-Cafe-Robinsons-Place-Jaro-61558440020458/" target="_blank" aria-label="Perk Up Cafe Facebook">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M14 8h3V4h-3c-3.3 0-5 1.7-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.7.3-1 1-1z"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Bottom Left - Shop Information -->
            <section class="shop-info">
                <h2>Perk Up Cafe</h2>
                <div class="shop-details">
                    <div class="shop-detail">
                        <h3>Location</h3>
                        <a href="https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.bing.com%2Fmaps%2Fdefault.aspx%3Fv%3D2%26pc%3DFACEBK%26mid%3D8100%26where1%3D2nd%2520Floor%2520Robinsons%2520Place%2520Jaro%252C%2520Iloilo%2520City%252C%2520Philippines%252C%25205000%26FORM%3DFBKPL1%26mkt%3Den-US%26fbclid%3DIwcGRvZgVleHRuA2FlbQIxMABicmlkETF1VjM1NVlNUkRNUTRHUVJKc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHkBK41GlY81KpQu-JncP25GlbZ5Kv6rhoJYVnZHaJPxoBhHn10n5wO8Cz2RT_aem_yHYRs9Q-9hdDDl7cR7UxuQ&h=AUCeOVq0_TCZPo0Au96nLQ9lT6he7S_3QR8EWpm-pjm9e1OOFGtZWJBp1APK8tO_XLx2f3vvybc9jm-AuIyegXizOXGGP0pQ0078Mf3JCzZVbkPtYvUnTY_4SrCRdgjW1IUf" target="_blank">
                            2nd Floor Robinsons Place Jaro, Iloilo City, Philippines, 5000
                        </a>
                    </div>
                    <div class="shop-detail">
                        <h3>Opening Hours</h3>
                        <p>Monday - Sunday</p>
                        <p>10:00 AM - 9:00 PM</p>
                    </div>

                    <div class="shop-detail">
                        <h3>Services</h3>
                        <p>In-Store Pickup</p>
                        <p>Dine-in</p>
                    </div>
                </div>
            </section>

            <!-- Bottom Right - Shop Image -->
            <div class="shop-image">
                <img src="assets/PerkUp-Hero.jpg" alt="Perk Up Cafe Shop">
            </div>
        </section>
    </main>

    <footer>
    </footer>
</body>
</html>
